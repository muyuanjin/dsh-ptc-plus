name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Pack and import from a clean consumer
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          consumers_dir="$(mktemp -d)"
          trap 'rm -rf -- "$pack_dir" "$consumers_dir"' EXIT
          archive="$(npm pack --silent --pack-destination "$pack_dir" --json | node scripts/npm-pack-filename.mjs)"
          for channel in latest next; do
            consumer_dir="$consumers_dir/$channel"
            mkdir "$consumer_dir"
            cd "$consumer_dir"
            npm init --yes
            npm install --ignore-scripts \
              "$pack_dir/$archive" \
              "@deepseek-ai/dsh-settings@$channel" \
              "@deepseek-ai/dsh-skill-filesystem@$channel" \
              "@deepseek-ai/dsh-tool-cordis@$channel" \
              "@deepseek-ai/dsh-tools@$channel"
            npm ls --depth=0 \
              @deepseek-ai/dsh-settings \
              @deepseek-ai/dsh-skill-filesystem \
              @deepseek-ai/dsh-tool-cordis \
              @deepseek-ai/dsh-tools
            node --input-type=module -e "const plugin = await import('dsh-ptc-plus'); if (plugin.name !== 'ptc-plus' || typeof plugin.apply !== 'function') throw new Error('invalid package exports')"
          done
