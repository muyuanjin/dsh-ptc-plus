name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # The session kernel runs in a killable helper process, so a stuck or
      # unresponsive kernel is reclaimed by killing that process instead of a
      # thread inside the host. A single deterministic run is the gate; the
      # retry wrapper that used to absorb in-host teardown aborts is gone with
      # that boundary.
      - name: Verify the reviewed candidate
        env:
          DSH_PTC_TEST_CONCURRENCY: 1
        shell: bash
        run: npm run check
      - name: Pack and load from a clean consumer
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$PWD"
          pack_dir="$(mktemp -d)"
          consumers_dir="$(mktemp -d)"
          trap 'rm -rf -- "$pack_dir" "$consumers_dir"' EXIT
          archive="$(npm pack --silent --pack-destination "$pack_dir" --json | node scripts/npm-pack-filename.mjs)"
          for channel in latest alpha; do
            consumer_dir="$consumers_dir/$channel"
            mkdir "$consumer_dir"
            cd "$consumer_dir"
            npm init --yes
            npm install --ignore-scripts "@deepseek-ai/dsh@$channel"
            npm install --ignore-scripts "$pack_dir/$archive"
            npm ls \
              @deepseek-ai/dsh-settings \
              @deepseek-ai/dsh-atomic-write \
              @deepseek-ai/dsh-home-paths \
              @deepseek-ai/dsh-llm \
              @deepseek-ai/dsh-skill-filesystem \
              @deepseek-ai/dsh-tool-cordis \
              @deepseek-ai/dsh-tools
            node --input-type=module -e "const plugin = await import('dsh-ptc-plus'); if (plugin.name !== 'ptc-plus' || typeof plugin.apply !== 'function') throw new Error('invalid package exports')"
            # An import alone cannot show that this host and the plugin agree on
            # an execution service: a plugin whose injection is unsatisfied stays
            # pending without an error, leaving run_code on the host's runtime.
            node "$repo_root/scripts/dsh-execution-seam-smoke.mjs" dsh-ptc-plus
            # The Remote descriptors are a second host-owned contract: a codec the
            # installed TYPERT registry rejects fails activation in the Host and in
            # the browser while an import and a load check still succeed.
            node "$repo_root/scripts/dsh-rpc-contract-smoke.mjs" dsh-ptc-plus
          done
