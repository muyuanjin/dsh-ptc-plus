name: CI

# Documentation-only changes skip the matrix: they cannot change the shipped
# runtime. A release commit always bumps package.json and package-lock.json, so
# the tagged commit still produces the successful run the Release workflow
# requires (see docs/publishing.md).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Install deterministic browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Verify portable runtime contracts
        run: npm run verify:ci

  # One job per host channel. The blocking channels are the published release and
  # the in-flight release candidate; the alpha channel is a pre-adaptation for a
  # line the host has not released yet, so it reports its result without blocking.
  host-contracts:
    name: host contract / ${{ matrix.channel }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'alpha' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, next, alpha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify the ${{ matrix.channel }} host channel
        shell: bash
        run: npm run test:host-contract -- ${{ matrix.channel }}
