name: CI

# Documentation-only changes skip the matrix: they cannot change the shipped
# runtime. A release commit always bumps package.json and package-lock.json, so
# the tagged commit still produces the successful run the Release workflow
# requires (see docs/publishing.md).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
            host-contracts: false
          - os: ubuntu-latest
            node: 24
            host-contracts: true
          - os: ubuntu-latest
            node: 26
            host-contracts: false
          - os: windows-latest
            node: 24
            host-contracts: false
          - os: macos-latest
            node: 24
            host-contracts: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Install deterministic browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Verify portable runtime contracts
        run: npm run verify:ci
      - name: Verify frozen latest and next host contracts
        if: matrix.host-contracts
        shell: bash
        run: npm run test:host-contract
