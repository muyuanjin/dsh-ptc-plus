name: CI

# Documentation-only changes skip the matrix: they cannot change the shipped
# runtime. A release commit always bumps package.json and package-lock.json, so
# the tagged commit still produces the successful run the Release workflow
# requires (see docs/publishing.md).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
            full: false
          - os: ubuntu-latest
            node: 24
            full: true
          - os: ubuntu-latest
            node: 26
            full: false
          - os: windows-latest
            node: 24
            full: false
          - os: macos-latest
            node: 24
            full: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # The session kernel runs in a killable helper process, so a stuck or
      # unresponsive kernel is reclaimed by killing that process instead of a
      # thread inside the host. A single deterministic run is the gate; the
      # retry wrapper that used to absorb in-host teardown aborts is gone with
      # that boundary.
      - name: Verify the reviewed candidate
        if: matrix.full
        env:
          DSH_PTC_TEST_CONCURRENCY: 1
        shell: bash
        run: npm run check
      - name: Verify platform behavior without coverage
        if: ${{ !matrix.full }}
        env:
          DSH_PTC_TEST_CONCURRENCY: 1
        shell: bash
        run: npm run verify:platform
      - name: Verify frozen latest and next host contracts
        if: matrix.full
        shell: bash
        run: npm run test:host-contract
