name: Refresh host channels

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dsh-host-channels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Resolve host channels from their dist-tags
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          npm run host:channels:update
          # The manifest is supply; the development lock is what the ordinary gates
          # materialize. Move it onto the new next release in the same commit.
          npm run host:channels:graph
          if git diff --quiet -- compat/channels.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the channel update branch
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/dsh-channels"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add compat/channels.json package-lock.json
          git commit -m "build(host): refresh host channels"
          git push --force origin "HEAD:refs/heads/$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "build(host): refresh host channels" --body "Refresh the tracked host channels from their official dist-tags. The normal CI workflow validates the packed plugin against each channel."
          else
            gh pr create --base main --head "$branch" --title "build(host): refresh host channels" --body "Refresh the tracked host channels from their official dist-tags. The normal CI workflow validates the packed plugin against each channel."
          fi
          # GITHUB_TOKEN suppresses workflow runs from its push and PR events,
          # so this dispatch is the candidate's only CI run.
          gh workflow run ci.yml --ref "$branch"
